<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF0055;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7928CA;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="none"/>
  <!-- Cyberpunk / Streetwear Graphic -->
  <rect x="80" y="80" width="440" height="440" fill="none" stroke="url(#grad1)" stroke-width="4"/>
  <rect x="95" y="95" width="410" height="410" fill="none" stroke="url(#grad1)" stroke-width="1" stroke-dasharray="4 8"/>
  <text x="300" y="180" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="44" font-weight="900" letter-spacing="4" text-anchor="middle">NEO•TOKYO</text>
  <text x="300" y="225" fill="#FF0055" font-family="'JetBrains Mono', monospace" font-size="16" letter-spacing="6" text-anchor="middle">SYNTHESIS LAB // 2099</text>
  
  <!-- Cyber barcode and glitch bars -->
  <line x1="120" y1="260" x2="480" y2="260" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="120" y1="270" x2="320" y2="270" stroke="#FF0055" stroke-width="2"/>
  <line x1="340" y1="270" x2="480" y2="270" stroke="#7928CA" stroke-width="2"/>

  <!-- Center abstract streetwear icon -->
  <polygon points="300,290 380,410 220,410" fill="url(#grad1)" opacity="0.9"/>
  <circle cx="300" cy="370" r="25" fill="#FFFFFF"/>

  <text x="300" y="475" fill="#E4E4E7" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="5" text-anchor="middle">OFFLINE VERIFIED</text>
  <text x="300" y="500" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="2" text-anchor="middle">[ 35.6762° N, 139.6503° E ]</text>
</svg>
